<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Dayflow</title>
  <meta name="theme-color" content="#080d22" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Dayflow" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
</head>
<body>
<style>
/* Layout concept: one-column phone app, 520px max, floating bottom nav, bottom-sheet forms.
   Dark navy base, blue→violet gradient as the single accent; amber/rose/teal only for meaning. */
:root{
  --bg:#080d22; --bg-2:#0d1430; --surface:#111a3a; --surface-2:#172046; --surface-3:#1f2a58;
  --line:rgba(140,158,255,.15); --line-2:rgba(140,158,255,.30);
  --fg:#eceffe; --muted:#a0abd8; --faint:#6c79ad;
  --blue:#5e96ff; --violet:#9a7dff; --good:#3fdc9b; --warn:#ffc35c; --bad:#ff7490; --teal:#38d8c6;
  --grad:linear-gradient(135deg,#4f8cff 0%,#8f6bff 100%);
  --glow:rgba(122,104,255,.18);
  --shadow:0 12px 32px -16px rgba(1,4,22,.9);
  --nav-bg:rgba(15,22,52,.86);
  --c-personal:#9a7dff; --c-college:#5e96ff; --c-assign:#ffc35c; --c-exam:#ff7490; --c-record:#38d8c6;
  --overlay:rgba(3,6,20,.66);
  --font:"Segoe UI Variable Text","SF Pro Text",system-ui,-apple-system,"Roboto","Helvetica Neue",Arial,sans-serif;
  --font-d:"Segoe UI Variable Display","SF Pro Display",system-ui,-apple-system,"Roboto","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f1f3fc; --bg-2:#e8ecfa; --surface:#ffffff; --surface-2:#f3f5fd; --surface-3:#e4e9fa;
  --line:rgba(40,56,140,.12); --line-2:rgba(40,56,140,.26);
  --fg:#131a3b; --muted:#546090; --faint:#7b86b4;
  --blue:#2c6bef; --violet:#6a4ce6; --good:#0f9f68; --warn:#b47400; --bad:#d3305a; --teal:#0a9588;
  --grad:linear-gradient(135deg,#2c6bef 0%,#6a4ce6 100%);
  --glow:rgba(106,76,230,.10);
  --shadow:0 12px 30px -18px rgba(40,56,140,.45);
  --nav-bg:rgba(255,255,255,.9);
  --c-personal:#6a4ce6; --c-college:#2c6bef; --c-assign:#b47400; --c-exam:#d3305a; --c-record:#0a9588;
  --overlay:rgba(19,26,59,.42);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background-color:var(--bg);
  background-image:radial-gradient(760px 420px at 85% -8%,var(--glow),transparent 70%);
  background-repeat:no-repeat;
  color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;
}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;text-align:inherit}
h1,h2,h3,p{margin:0}
input,select,textarea{
  font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);
  border-radius:14px;padding:11px 14px;width:100%;min-height:46px;min-width:0;
}
textarea{resize:vertical;min-height:110px;line-height:1.5}
input[type=checkbox]{width:auto;min-height:0}
input::placeholder,textarea::placeholder{color:var(--faint)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(94,150,255,.22)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
option{background:var(--surface);color:var(--fg)}
.num{font-variant-numeric:tabular-nums}

.shell{max-width:520px;margin:0 auto;padding-bottom:112px}
#view{min-height:60vh}
#view.enter{animation:rise .38s cubic-bezier(.2,.8,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}

/* icons */
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}.ic.md{width:19px;height:19px}.ic.lg{width:28px;height:28px}

/* type */
.h1{font:800 26px/1.12 var(--font-d);letter-spacing:-.02em}
.h2{font:700 16px/1.2 var(--font-d);letter-spacing:-.01em}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}.tiny{font-size:12px}
.strong{font-weight:700}.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* structure */
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.gap8{display:flex;flex-direction:column;gap:8px}
.wrap{flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.tap{width:100%;display:block;transition:transform .12s}
.card.tap:active{transform:scale(.985)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 10px}
.link{color:var(--blue);font-weight:700;font-size:13px;padding:6px 0 6px 10px}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}
.empty .ic{width:34px;height:34px;color:var(--faint);margin-bottom:8px}
.empty p{margin-bottom:12px}
.hr{height:1px;background:var(--line);margin:12px 0;border:0}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%}
.li:first-child{border-top:0}

/* header */
.head{display:flex;align-items:center;gap:12px;padding:20px 0 6px}
.head .h1{flex:1;min-width:0}
.iconbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);flex:none;transition:transform .12s}
.iconbtn:active{transform:scale(.92)}
.iconbtn.grad{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 10px 22px -10px rgba(100,110,255,.9)}
.sub{color:var(--muted);font-size:14px;margin:2px 0 14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);transition:transform .12s,opacity .2s;text-align:center}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 12px 24px -12px rgba(100,110,255,.95)}
.btn.danger{color:var(--bad);border-color:rgba(255,116,144,.4)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 13px;font-size:13px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* chips / seg / pills */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin-inline:-2px;padding:2px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;flex:none;transition:background .15s}
.chip.on{background:var(--grad);color:#fff;border-color:transparent}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--dc,var(--blue))}
.daychip{min-width:52px;flex-direction:column;gap:2px;padding:8px 10px;border-radius:16px}
.daychip small{font-size:10px;font-weight:700;opacity:.8;display:block;text-align:center}
.daychip .today-dot{width:5px;height:5px;border-radius:50%;background:var(--blue);margin-top:1px}
.daychip.on .today-dot{background:#fff}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);padding:4px;border-radius:15px;gap:4px}
.seg button{flex:1;padding:9px 6px;border-radius:11px;font-weight:700;font-size:13px;color:var(--muted);text-align:center}
.seg button.on{background:var(--grad);color:#fff;box-shadow:0 6px 14px -8px rgba(100,110,255,.9)}
.pill{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--surface-3);color:var(--muted);white-space:nowrap}
.pill.bad{background:rgba(255,116,144,.16);color:var(--bad)}
.pill.warn{background:rgba(255,195,92,.16);color:var(--warn)}
.pill.good{background:rgba(63,220,155,.15);color:var(--good)}
.pill.blue{background:rgba(94,150,255,.16);color:var(--blue)}
.pill.violet{background:rgba(154,125,255,.18);color:var(--violet)}

/* progress */
.bar{height:8px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .6s cubic-bezier(.2,.8,.3,1)}
.bar.good>i{background:var(--good)}.bar.bad>i{background:var(--bad)}.bar.warn>i{background:var(--warn)}
.meter{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;font-size:13px}
.meter .bar{height:6px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.nav-in{pointer-events:auto;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--nav-bg);border:1px solid var(--line);border-radius:26px;padding:6px;box-shadow:0 18px 40px -14px rgba(1,4,22,.85);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border-radius:20px;font-size:11px;font-weight:700;color:var(--faint);transition:background .2s,color .2s}
.nav button.on{background:var(--grad);color:#fff;box-shadow:0 8px 18px -8px rgba(100,110,255,.95)}

/* sheets & dialogs */
.overlay{position:fixed;inset:0;z-index:50;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s both}
.overlay.center{align-items:center;padding:20px}
.sheet{width:100%;max-width:520px;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:slideUp .3s cubic-bezier(.2,.9,.3,1) both;overscroll-behavior:contain}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line-2);margin:2px auto 12px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.dialog{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line-2);border-radius:24px;padding:22px;animation:pop .25s both;box-shadow:0 30px 60px -20px rgba(0,0,0,.7)}
.dialog p{color:var(--muted);margin:8px 0 18px}
.form{display:flex;flex-direction:column;gap:14px}
.field>label,.lbl{display:block;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.err{color:var(--bad);font-size:13px;font-weight:600;min-height:0}
.actions{display:flex;gap:10px;margin-top:4px}
.actions .btn{flex:1}

/* toasts */
.toasts{position:fixed;left:0;right:0;top:calc(12px + env(safe-area-inset-top,0px));z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--surface-3);color:var(--fg);border:1px solid var(--line-2);padding:10px 16px;border-radius:16px;font-weight:700;font-size:14px;box-shadow:0 14px 30px -10px rgba(0,0,0,.6);display:flex;align-items:center;gap:10px;animation:pop .28s both;max-width:420px}
.toast.xp{background:var(--grad);color:#fff;border-color:transparent}
.toast.out{opacity:0;transform:translateY(-8px);transition:.3s}

/* checkbox */
.cbw{width:44px;height:44px;margin:-9px -9px -9px -9px;display:grid;place-items:center;flex:none}
.cb{width:26px;height:26px;border-radius:9px;border:2px solid var(--line-2);display:grid;place-items:center;color:transparent;transition:all .18s}
.cb .ic{width:16px;height:16px;stroke-width:3}
.cb.on{background:var(--good);border-color:var(--good);color:#04241a}

/* home */
.greet{display:flex;align-items:center;gap:12px;padding:22px 0 14px}
.lvl{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:800;font-size:13px}
.lvl .ic{color:var(--warn)}
.hero{background:linear-gradient(160deg,var(--surface-2),var(--surface));position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:var(--glow);filter:blur(10px);pointer-events:none}
.ringbox{position:relative;width:112px;height:112px;flex:none}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringbox .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-bg{stroke:var(--surface-3)}
.score{font:800 32px/1 var(--font-d);letter-spacing:-.03em}
.next{display:flex;gap:14px;align-items:center}
.next .big{font:800 28px/1 var(--font-d);letter-spacing:-.02em}
.stripe{width:5px;align-self:stretch;border-radius:5px;background:var(--cc,var(--blue));flex:none}
.cls{display:flex;gap:12px;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);width:100%;transition:transform .12s}
.cls:active{transform:scale(.985)}
.cls.now{border-color:var(--blue);background:linear-gradient(160deg,var(--surface-2),var(--surface));box-shadow:0 0 0 1px var(--blue) inset}
.cls.next{border-color:var(--violet)}
.cls.past{opacity:.55}
.cls .tm{min-width:70px;font-size:13px;font-weight:700;line-height:1.35}
.gapblock{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1.5px dashed var(--line-2);border-radius:16px;color:var(--muted);font-size:13px;width:100%}
.mini{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);width:100%}
.mini:first-child{border-top:0}
.mini .t{width:58px;font-size:12px;font-weight:700;color:var(--muted);flex:none}
.datebox{width:46px;height:50px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1.1}
.datebox b{font:800 17px var(--font-d)}.datebox span{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.catdot{width:9px;height:9px;border-radius:50%;background:var(--cc);flex:none}
.habchip{display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--muted);transition:all .18s}
.habchip.on{background:rgba(63,220,155,.14);border-color:rgba(63,220,155,.5);color:var(--good)}

/* timetable & free */
.slot{border-radius:20px;border:1px solid var(--line);background:var(--surface);padding:14px}
.sug{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.sug:first-of-type{border-top:0}
.sug .sico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--blue);flex:none}
.sug.brk .sico{color:var(--teal)}

/* calendar */
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calgrid .dow{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);text-align:center;padding:4px 0}
.cell{aspect-ratio:1/1.08;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-weight:700;font-size:14px;color:var(--fg);transition:background .15s}
.cell.out{opacity:.32}
.cell.today{box-shadow:0 0 0 1.5px var(--blue) inset}
.cell.sel{background:var(--grad);color:#fff;box-shadow:none}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--dc)}
.cell.sel .dots i{background:#fff}
.agenda{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;align-items:flex-start}
.agenda:first-child{border-top:0}
.agenda .tm{width:66px;font-size:12px;font-weight:700;color:var(--muted);flex:none;padding-top:2px}
.agenda.virt{opacity:.8}
.weekrow{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%}
.weekrow:first-child{border-top:0}
.weekrow .dh{width:46px;flex:none;text-align:center}
.weekrow .dh b{display:block;font:800 18px var(--font-d)}
.weekrow .dh span{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
.weekrow.today .dh b{color:var(--blue)}
.evt{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}

/* focus */
.ringwrap{position:relative;width:min(76vw,290px);aspect-ratio:1;margin:8px auto 4px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .fg{transition:stroke-dashoffset 1s linear}
.ringwrap .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tnum{font:800 54px/1 var(--font-d);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.controls{display:flex;justify-content:center;align-items:center;gap:18px;margin:14px 0 4px}
.playbtn{width:76px;height:76px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 16px 34px -12px rgba(110,110,255,.95);transition:transform .12s}
.playbtn:active{transform:scale(.93)}
.playbtn .ic{width:30px;height:30px}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.stat b{display:block;font:800 20px var(--font-d);letter-spacing:-.02em}
.stat span{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* charts */
.chart{width:100%;height:auto;display:block}
.ct{fill:var(--muted);font-size:10px;font-family:var(--font)}
.cv{fill:var(--fg);font-size:10px;font-weight:700;font-family:var(--font)}
.gridl{stroke:var(--line);stroke-width:1}
.goall{stroke:var(--warn);stroke-width:1.4;stroke-dasharray:4 4}
.b-ok{fill:var(--blue)}.b-over{fill:var(--bad)}.b-none{fill:var(--surface-3)}.b-grad{fill:var(--violet)}

/* habits */
.hgrid{display:grid;gap:6px;align-items:center}
.hcell{width:34px;height:34px;border-radius:11px;border:1.5px solid var(--line-2);display:grid;place-items:center;color:transparent;margin-inline:auto;transition:all .15s}
.hcell .ic{width:15px;height:15px;stroke-width:3}
.hcell.on{background:var(--good);border-color:var(--good);color:#04241a}
.hcell.today{border-color:var(--blue)}
.hcell.off{opacity:.3;pointer-events:none}
.hcell.mini{width:28px;height:28px;border-radius:9px}
.streak{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:13px;color:var(--warn)}
.streak .ic{width:16px;height:16px;fill:var(--warn);stroke:var(--warn)}

/* more grid */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:22px;background:var(--surface);border:1px solid var(--line);transition:transform .12s;min-height:108px}
.tile:active{transform:scale(.97)}
.tile .ti{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:var(--grad-soft,var(--surface-2));color:var(--blue);background:var(--surface-2)}
.tile b{font:700 15px var(--font-d)}

/* rewards */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{border-radius:18px;padding:14px 8px;text-align:center;background:var(--surface);border:1px solid var(--line)}
.badge .bi{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;margin:0 auto 8px;background:var(--grad);color:#fff;box-shadow:0 10px 20px -10px rgba(110,110,255,.9)}
.badge.lock .bi{background:var(--surface-3);color:var(--faint);box-shadow:none}
.badge b{display:block;font-size:12.5px;line-height:1.2}
.badge span{font-size:11px;color:var(--muted);display:block;margin-top:3px;line-height:1.25}

.banner{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:18px;border:1px solid var(--line-2);background:var(--surface-2);font-size:13.5px}
.banner.warn{border-color:rgba(255,195,92,.5);background:rgba(255,195,92,.09)}
.banner.good{border-color:rgba(63,220,155,.45);background:rgba(63,220,155,.08)}
.banner .ic{margin-top:1px}
.avatar{width:54px;height:54px;border-radius:19px;background:var(--grad);color:#fff;display:grid;place-items:center;font:800 22px var(--font-d);flex:none}
.switch{position:relative;width:50px;height:30px;border-radius:99px;background:var(--surface-3);border:1px solid var(--line-2);flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--fg);transition:transform .2s}
.switch.on{background:var(--good);border-color:var(--good)}
.switch.on::after{transform:translateX(20px);background:#fff}
pre.out{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px;max-height:180px;overflow:auto;font-size:11.5px;white-space:pre-wrap;word-break:break-all;margin:0}
.hidden-file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

body { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }

/* ============ backup ============ */
function backupText() { return JSON.stringify({ app: 'DAYFLOW', version: 1, exportedAt: new Date().toISOString(), data: S }, null, 2); }
function showExportText(msg) {
  var out = $('#export-out'); if (!out) return;
  out.innerHTML = (msg ? '<div class="banner" style="margin-bottom:10px">' + ic('info') + '<div>' + esc(msg) + '</div></div>' : '') + '<textarea id="export-text" readonly aria-label="Backup text" style="min-height:140px;font-size:12px"></textarea><button class="btn block" style="margin-top:10px" data-a="copyBackup">' + ic('copy', 'md') + 'Copy to clipboard</button>';
  $('#export-text').value = backupText();
}
async function exportFile() {
  saveNow();
  try {
    var blob = new Blob([backupText()], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'dayflow-backup-' + today() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    S.meta.lastBackup = today();
    saveNow();
    render();
    toast('Backup file saved');
  } catch (e) {
    showExportText('Copy the backup text below and keep it somewhere safe.');
  }
}
function copyBackup() {
  var ta = $('#export-text'); if (!ta) return;
  var fallback = function () { try { ta.focus(); ta.select(); document.execCommand('copy'); toast('Copied. Paste it somewhere safe.'); } catch (e) { toast('Select the text and copy it by hand.'); } };
  try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(function () { S.meta.lastBackup = today(); saveNow(); toast('Copied. Paste it somewhere safe.'); }, fallback); else fallback(); } catch (e) { fallback(); }
}
function parseBackup(text) {
  var o = JSON.parse(text), data = o && o.app === 'DAYFLOW' && o.data ? o.data : o;
  if (!data || typeof data !== 'object' || !(data.profile || Array.isArray(data.classes) || Array.isArray(data.tasks))) throw new Error('bad');
  return migrate(data);
}
function importText(text) {
  var next; try { next = parseBackup(text); } catch (e) { toast('That is not a valid DAYFLOW backup.'); return; }
  confirmBox({
    title: 'Replace your data?', ok: 'Replace data', danger: true,
    text: 'This replaces everything in DAYFLOW on this device with the backup (' + next.classes.length + ' classes, ' + next.tasks.length + ' tasks, ' + next.habits.length + ' habits, ' + next.notes.length + ' notes). It cannot be undone.',
    onOk: function () { stopTicker(); S = next; S.meta.onboarded = true; pendingToasts = []; ui.showPaste = false; saveNow(); resumeTimer(); render(); toast('Backup imported'); }
  });
}
function resumeTimer() { if (S.timer.running) { if (S.timer.endAt <= Date.now()) timerDone(); else { startTicker(); setWake(true); } } }

forms.onboard = function (fd, f, e) {
  var mode = e && e.submitter ? e.submitter.value : 'empty';
  mutate(function () {
    S.profile.name = String(fd.get('name') || '').trim(); S.meta.onboarded = true; addStarterHabits();
    if (mode === 'demo') loadDemo();
  });
  closeSheet(); toast(mode === 'demo' ? 'Example data loaded. Explore every screen.' : 'All set. Start by adding your classes.');
};
forms['class'] = function (fd, f) {
  var id = f.dataset.id, subject = String(fd.get('subject')).trim(), teacher = String(fd.get('teacher')).trim(), room = String(fd.get('room')).trim();
  var start = fd.get('start'), end = fd.get('end'), type = fd.get('type') || 'lecture';
  var days = String(fd.get('days') || '').split(',').filter(Boolean).map(Number).sort();
  if (!subject) return err('Enter a subject name.');
  if (!start || !end) return err('Choose a start and an end time.');
  if (toMin(end) <= toMin(start)) return err('The end time must be after the start time.');
  if (!days.length) return err('Pick at least one day.');
  for (var i = 0; i < days.length; i++) {
    var clash = S.classes.find(function (x) { return x.day === days[i] && x.id !== id && toMin(x.start) < toMin(end) && toMin(x.end) > toMin(start); });
    if (clash) return err('Overlaps with ' + clash.subject + ' (' + fmtT(clash.start) + ' – ' + fmtT(clash.end) + ') on ' + DAYS[days[i]] + '.');
  }
  ui.ttDay = days[0];
  mutate(function () {
    ensureSubject(subject, teacher);
    var base = { subject: subject, teacher: teacher, room: room, start: start, end: end, type: type };
    if (id) { var c = findBy(S.classes, id); Object.assign(c, base, { day: days[0] }); delete c.demo; days.slice(1).forEach(function (d) { S.classes.push(Object.assign({ id: uid(), day: d }, base)); }); }
    else days.forEach(function (d) { S.classes.push(Object.assign({ id: uid(), day: d }, base)); });
  });
  closeSheet(); toast(id ? 'Class updated' : (days.length > 1 ? days.length + ' classes added' : 'Class added'));
};
forms.event = function (fd, f) {
  var id = f.dataset.id, title = String(fd.get('title')).trim(), date = fd.get('date'), all = !!fd.get('allDay'), start = all ? '' : fd.get('start'), end = all ? '' : fd.get('end');
  if (!title) return err('Give the event a title.');
  if (!date) return err('Choose a date.');
  if (!all && start && end && toMin(end) <= toMin(start)) return err('The end time must be after the start time.');
  var subject = String(fd.get('subject')).trim();
  mutate(function () {
    if (subject) ensureSubject(subject);
    var o = { title: title, cat: fd.get('cat') || 'personal', date: date, allDay: all, start: start || '', end: end || '', subject: subject, desc: String(fd.get('desc')).trim() };
    if (id) { var e = findBy(S.events, id); Object.assign(e, o); delete e.demo; } else S.events.push(Object.assign({ id: uid() }, o));
  });
  ui.calSel = date; closeSheet(); toast(id ? 'Event updated' : 'Event added');
};
forms.task = function (fd, f) {
  var id = f.dataset.id, title = String(fd.get('title')).trim();
  if (!title) return err('Give the task a title.');
  var o = { title: title, subject: String(fd.get('subject')).trim(), deadline: fd.get('deadline') || '', priority: fd.get('priority') || 'medium', desc: String(fd.get('desc')).trim() };
  mutate(function () {
    if (o.subject) ensureSubject(o.subject);
    if (id) { var t = findBy(S.tasks, id); Object.assign(t, o); delete t.demo; } else S.tasks.push(Object.assign({ id: uid(), done: false, created: Date.now() }, o));
  });
  closeSheet(); toast(id ? 'Task updated' : 'Task added');
};
forms.habit = function (fd, f) {
  var id = f.dataset.id, name = String(fd.get('name')).trim();
  if (!name) return err('Name your habit.');
  mutate(function () { if (id) { var x = findBy(S.habits, id); x.name = name; x.icon = fd.get('icon') || 'target'; } else S.habits.push({ id: uid(), name: name, icon: fd.get('icon') || 'target', created: today(), log: {} }); });
  closeSheet(); toast(id ? 'Habit updated' : 'Habit created');
};
forms.note = function (fd, f) {
  var id = f.dataset.id, title = String(fd.get('title')).trim(), body = String(fd.get('body')).trim();
  if (!title && !body) return err('Write a title or some text first.');
  mutate(function () {
    var o = { title: title, body: body, cat: fd.get('cat') || 'General', pinned: !!fd.get('pinned'), updated: Date.now() };
    if (id) { var n = findBy(S.notes, id); Object.assign(n, o); delete n.demo; } else S.notes.push(Object.assign({ id: uid(), created: Date.now() }, o));
  });
  closeSheet(); toast('Note saved');
};
forms.subject = function (fd, f) {
  var id = f.dataset.id, name = String(fd.get('name')).trim(), goal = parseFloat(fd.get('goal'));
  if (!name) return err('Enter a subject name.');
  if (S.subjects.some(function (s) { return s.id !== id && norm(s.name) === norm(name); })) return err('You already have a subject with that name.');
  mutate(function () {
    var o = { name: name, teacher: String(fd.get('teacher')).trim(), goal: isNaN(goal) ? 5 : clamp(goal, 0, 40), color: fd.get('color') || colorFor(name) };
    if (id) { var s = findBy(S.subjects, id), old = s.name; Object.assign(s, o); delete s.demo; if (norm(old) !== norm(name)) { S.classes.forEach(function (c) { if (norm(c.subject) === norm(old)) c.subject = name; }); S.tasks.forEach(function (c) { if (norm(c.subject) === norm(old)) c.subject = name; }); S.events.forEach(function (c) { if (norm(c.subject) === norm(old)) c.subject = name; }); S.sessions.forEach(function (c) { if (norm(c.subject) === norm(old)) c.subject = name; }); if (norm(S.timer.subject) === norm(old)) S.timer.subject = name; } }
    else S.subjects.push(Object.assign({ id: uid() }, o));
  });
  closeSheet(); toast('Subject saved');
};
forms.goal = function (fd, f) {
  var id = f.dataset.id, text = String(fd.get('text')).trim(); if (!text) return err('Write your goal.');
  mutate(function () { if (id) { var g = findBy(S.goals, id); g.text = text; delete g.demo; } else S.goals.push({ id: uid(), text: text, done: false }); });
  closeSheet();
};
forms.semester = function (fd) {
  var a = fd.get('semStart'), b = fd.get('semEnd');
  if (a && b && b < a) return err('The end date must be after the start date.');
  mutate(function () { S.profile.semName = String(fd.get('semName')).trim(); S.profile.semStart = a || ''; S.profile.semEnd = b || ''; S.meta.demoSem = false; });
  closeSheet(); toast('Semester updated');
};
forms.screen = function (fd) {
  var date = fd.get('date'), h = parseInt(fd.get('h'), 10) || 0, m = parseInt(fd.get('m'), 10) || 0, tot = h * 60 + m;
  if (!date) return err('Choose a date.');
  if (date > today()) return err('Choose today or an earlier day.');
  if (tot <= 0) return err('Enter at least one minute, or use Remove to clear this day.');
  if (tot > 1440) return err('A day only has 24 hours.');
  mutate(function () { S.screen.log[date] = { m: tot }; });
  closeSheet(); toast('Screen time saved');
};
forms.screengoal = function (fd) {
  var tot = (parseInt(fd.get('h'), 10) || 0) * 60 + (parseInt(fd.get('m'), 10) || 0);
  if (tot < 15) return err('Pick a goal of at least 15 minutes.');
  if (tot > 1440) return err('A day only has 24 hours.');
  mutate(function () { S.screen.goal = tot; }); closeSheet(); toast('Goal set to ' + fmtDur(tot));
};
forms.timer = function (fd) {
  var keys = ['focus', 'short', 'long', 'custom'], mx = { focus: 180, short: 60, long: 90, custom: 240 }, next = {};
  for (var i = 0; i < keys.length; i++) { var v = parseInt(fd.get(keys[i]), 10); if (!v || v < 1 || v > mx[keys[i]]) return err('Use 1 to ' + mx[keys[i]] + ' minutes for ' + keys[i] + '.'); next[keys[i]] = v; }
  S.pomo = next;
  if (!S.timer.running) { S.timer.total = timerModeSecs(S.timer.mode); S.timer.remaining = S.timer.total; }
  saveNow(); closeSheet(); render(); toast(S.timer.running ? 'Saved. Applies to the next session.' : 'Timer lengths saved');
};

/* ============ actions ============ */
var A = {};
A.noop = function () {};
A.go = function (el) { closeSheet(); go(el.dataset.v); };
A.closeSheet = function () { closeSheet(); };
A.snoozeBackup = function () { S.meta.nudgeUntil = Date.now() + 7 * 864e5; save(); render(); toast('We will remind you again in a week'); };
A.sheetBg = function (el, e) { if (e.target === el) closeSheet(); };
A.dlgBg = function (el, e) { if (e.target === el) closeDialog(); };
A.dlgCancel = function () { closeDialog(); };
A.dlgOk = function () { var f = dlgOk; closeDialog(); if (f) f(); };
A.pick = function (el) {
  var g = el.closest('[data-group]'), form = el.closest('form'), hid = form.elements[g.dataset.group];
  if (g.dataset.multi) { el.classList.toggle('on'); hid.value = $$('.chip.on', g).map(function (c) { return c.dataset.v; }).join(','); }
  else { $$('.chip', g).forEach(function (c) { c.classList.remove('on'); }); el.classList.add('on'); hid.value = el.dataset.v; }
};
function switchTo(el, name) {
  var on = !el.classList.contains('on'); el.classList.toggle('on', on); el.setAttribute('aria-checked', on);
  var f = el.closest('form'); f.elements[name].value = on ? '1' : ''; return on;
}
A.allDaySwitch = function (el) { var on = switchTo(el, 'allDay'); $('#e-times').hidden = on; };
A.pinSwitch = function (el) { switchTo(el, 'pinned'); };

/* timetable / free */
A.ttDay = function (el) { ui.ttDay = +el.dataset.v; render(); };
A.addClass = function (el) { classSheet(null, +el.dataset.day || ui.ttDay); };
A.editClass = function (el) { classSheet(el.dataset.id); };
A.delClass = function (el) { var id = el.dataset.id; askDelete('this class', function () { mutate(function () { S.classes = S.classes.filter(function (c) { return c.id !== id; }); }); toast('Class deleted'); }); };
A.planFree = function (el) { ui.freeDay = +el.dataset.day; go('free'); };
A.freeDay = function (el) { ui.freeDay = +el.dataset.v; render(); };
A.focusFor = function (el) {
  var s = el.dataset.s || ''; S.timer.subject = subjectOf(s) ? subjectOf(s).name : '';
  if (!S.timer.running && S.timer.mode !== 'focus') timerSetMode('focus');
  saveNow(); go('focus'); toast(S.timer.subject ? 'Ready to focus on ' + S.timer.subject : 'Ready to focus');
};

/* tasks */
A.taskStatus = function (el) { ui.taskStatus = el.dataset.v; render(); };
A.addTask = function () { taskSheet(null); };
A.editTask = function (el) { taskSheet(el.dataset.id); };
A.delTask = function (el) { var id = el.dataset.id; askDelete('this task', function () { mutate(function () { S.tasks = S.tasks.filter(function (t) { return t.id !== id; }); }); toast('Task deleted'); }); };
A.toggleTask = function (el) {
  mutate(function () {
    var t = findBy(S.tasks, el.dataset.id); if (!t) return;
    t.done = !t.done;
    if (t.done) { t.doneOn = today(); t.doneAt = Date.now(); award('task:' + t.id, { high: 30, medium: 20, low: 10 }[t.priority] || 20, 'Task complete'); }
    else { t.doneOn = null; t.doneAt = null; }
  });
};

/* calendar */
A.calView = function (el) { ui.calView = el.dataset.v; render(); };
A.calNav = function (el) { calMove(+el.dataset.v); render(); };
A.calSel = function (el) { ui.calSel = el.dataset.d; render(); };
A.calOpenDay = function (el) { ui.calSel = el.dataset.d; ui.calView = 'day'; render(); };
A.calClassesToggle = function () { ui.calClasses = !ui.calClasses; render(); };
A.addEvent = function (el) { eventSheet(null, el.dataset.d, el.dataset.cat); };
A.editEvent = function (el) { eventSheet(el.dataset.id); };
A.delEvent = function (el) { var id = el.dataset.id; askDelete('this event', function () { mutate(function () { S.events = S.events.filter(function (e) { return e.id !== id; }); }); toast('Event deleted'); }); };

/* focus */
A.timerMode = function (el) { if (!timerSetMode(el.dataset.v)) toast('Pause and reset the timer to switch modes'); render(); };
A.timerToggle = function () { if (S.timer.running) timerPause(); else timerStart(); render(); };
A.timerReset = function () { timerReset(); render(); };
A.timerSkip = function () { timerReset(); timerSetMode('focus'); render(); };
A.timerLog = function () { var m = timerLogNow(); if (m) { render(); toast('Logged ' + m + ' min of study'); flushToasts(); } else toast('Study for at least a minute first'); };
A.timerSettings = function () { timerSheet(); };
A.timerDefaults = function () { var f = $('form[data-form="timer"]'); if (!f) return; f.elements.focus.value = 25; f.elements.short.value = 5; f.elements.long.value = 15; f.elements.custom.value = 45; };
A.histToggle = function () { ui.histOpen = !ui.histOpen; render(); };
A.delSession = function (el) { var id = el.dataset.id; mutate(function () { S.sessions = S.sessions.filter(function (s) { return s.id !== id; }); }); toast('Session removed'); };

/* screen time */
A.logScreen = function (el) { screenSheet(el.dataset.d || today()); };
A.screenGoal = function () { screenGoalSheet(); };
A.scrView = function (el) { ui.scrView = el.dataset.v; render(); };
A.scrAdd = function (el) { var t = today(), add = +el.dataset.m; mutate(function () { var e = S.screen.log[t]; S.screen.log[t] = { m: Math.min(1440, (e ? e.m : 0) + add) }; }); toast('Added ' + add + ' min to today'); };
A.delScreen = function (el) { var d = el.dataset.d; mutate(function () { delete S.screen.log[d]; }); closeSheet(); toast('Entry removed'); };

/* habits */
A.addHabit = function () { habitSheet(null); };
A.editHabit = function (el) { habitSheet(el.dataset.id); };
A.habitInfo = function (el) { habitInfoSheet(el.dataset.id); };
A.delHabit = function (el) { var id = el.dataset.id; askDelete('this habit and its history', function () { mutate(function () { S.habits = S.habits.filter(function (h) { return h.id !== id; }); }); toast('Habit deleted'); }); };
function toggleHabit(id, d) {
  if (d > today()) return;
  mutate(function () {
    var h = findBy(S.habits, id); if (!h) return;
    if (h.log[d]) delete h.log[d]; else { h.log[d] = 1; if (d === today()) award('habit:' + h.id + ':' + d, 10, 'Habit: ' + h.name); }
  });
}
A.habDay = function (el) { toggleHabit(el.dataset.id, el.dataset.d); };
A.habDayDetail = function (el) { toggleHabit(el.dataset.id, el.dataset.d); habitInfoSheet(el.dataset.id); };

/* semester */
A.editSemester = function () { semesterSheet(); };
A.addSubject = function () { subjectSheet(null); };
A.editSubject = function (el) { subjectSheet(el.dataset.id); };
A.delSubject = function (el) { var id = el.dataset.id; askDelete('this subject (classes and tasks keep their text)', function () { mutate(function () { S.subjects = S.subjects.filter(function (s) { return s.id !== id; }); }); }); };
A.addGoal = function () { goalSheet(null); };
A.editGoal = function (el) { goalSheet(el.dataset.id); };
A.toggleGoal = function (el) { mutate(function () { var g = findBy(S.goals, el.dataset.id); if (g) g.done = !g.done; }); };
A.delGoal = function (el) { var id = el.dataset.id; askDelete('this goal', function () { mutate(function () { S.goals = S.goals.filter(function (g) { return g.id !== id; }); }); }); };

/* notes */
A.addNote = function () { noteSheet(null); };
A.editNote = function (el) { noteSheet(el.dataset.id); };
A.delNote = function (el) { var id = el.dataset.id; askDelete('this note', function () { mutate(function () { S.notes = S.notes.filter(function (n) { return n.id !== id; }); }); toast('Note deleted'); }); };
A.noteCat = function (el) { ui.noteCat = el.dataset.v; render(); };

/* settings & data */
A.setPref = function (el) { S.profile[el.dataset.k] = el.dataset.v; save(); render(); };
A.toggleSound = function () { S.profile.sound = !S.profile.sound; save(); render(); };
A.exportFile = function () { exportFile(); };
A.exportText = function () { showExportText(''); };
A.copyBackup = function () { copyBackup(); };
A.pasteToggle = function () { ui.showPaste = !ui.showPaste; render(); };
A.importPasted = function () { var t = $('#imp-text'); if (!t || !t.value.trim()) { toast('Paste your backup text first'); return; } importText(t.value); };
A.removeDemo = function () {
  confirmBox({ title: 'Remove example data?', text: 'Example classes, tasks, events, notes, sessions and screen-time entries are deleted. Anything you added or edited yourself stays.', ok: 'Remove', danger: true, onOk: function () { mutate(removeDemo); toast('Example data removed'); } });
};
A.resetAll = function () {
  confirmBox({ title: 'Reset everything?', text: 'This permanently deletes all your data in DAYFLOW on this device, including XP and badges. Export a backup first if you might want it back.', ok: 'Delete everything', danger: true,
    onOk: function () { stopTicker(); setWake(false); try { localStorage.removeItem(KEY); } catch (e) {} S = defaultState(); pendingToasts = []; ui.route = 'home'; try { location.hash = 'v-home'; } catch (e) {} saveNow(); render(); window.scrollTo(0, 0); onboardingSheet(); } });
};

/* ============ events ============ */
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-a]'); if (!el) return;
  var fn = A[el.dataset.a]; if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  fn(el, e);
});
document.addEventListener('submit', function (e) {
  var f = e.target.closest ? e.target.closest('form[data-form]') : null; if (!f) return;
  e.preventDefault(); var h = forms[f.dataset.form]; if (h) h(new FormData(f), f, e);
});
document.addEventListener('input', function (e) {
  if (e.target && e.target.id === 'note-q') { ui.noteQ = e.target.value; var l = $('#notes-list'); if (l) l.innerHTML = notesListHTML(); }
});
document.addEventListener('change', function (e) {
  var el = e.target; if (!el) return;
  if (el.dataset && el.dataset.pref) {
    var k = el.dataset.pref, v = el.value;
    if (k === 'studyGoal') v = clamp(parseInt(v, 10) || 120, 10, 720);
    if (k === 'weekStart') v = parseInt(v, 10);
    S.profile[k] = v;
    if ((k === 'dayStart' || k === 'dayEnd') && toMin(S.profile.dayEnd) <= toMin(S.profile.dayStart)) { S.profile.dayStart = '08:00'; S.profile.dayEnd = '21:00'; toast('The day must end after it starts. Reset to 8:00–21:00.'); render(); }
    save(); if (el.dataset.rerender) render(); return;
  }
  if (el.id === 't-subject') { S.timer.subject = el.value; save(); var s = $('#t-sub'); if (s) s.textContent = el.value || 'No subject'; }
  else if (el.id === 'tf-subj') { ui.taskSubj = el.value; render(); }
  else if (el.id === 'tf-when') { ui.taskWhen = el.value; render(); }
  else if (el.id === 'free-min') { ui.freeMin = +el.value; render(); }
  else if (el.id === 'imp-file' && el.files && el.files[0]) {
    var fr = new FileReader(); fr.onload = function () { importText(String(fr.result)); }; fr.onerror = function () { toast('Could not read that file.'); }; fr.readAsText(el.files[0]); el.value = '';
  }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if (dlgOpen) closeDialog(); else if (sheetOpen && !$('.sheet [data-form="onboard"]')) closeSheet(); } });
window.addEventListener('hashchange', function () {
  var r = (location.hash || '').replace('#v-', '');
  if (VIEWS[r] && r !== ui.route) { closeSheet(); ui.route = r; window.scrollTo(0, 0); render(); }
});

/* ============ boot ============ */
var lastMinute = '';
setInterval(function () {
  if (document.hidden || sheetOpen || dlgOpen) return;
  var d = new Date(), k = d.getHours() + ':' + d.getMinutes();
  if (k !== lastMinute) { lastMinute = k; if (['home', 'timetable', 'free'].indexOf(ui.route) >= 0) render(); }
}, 15000);
(function buildNav() {
  var items = [['home', 'Home', 'home'], ['timetable', 'Classes', 'timetable'], ['focus', 'Focus', 'timer'], ['tasks', 'Tasks', 'checkc'], ['more', 'More', 'grid']];
  $('#nav').innerHTML = items.map(function (x) { return '<button data-a="go" data-v="' + x[0] + '" aria-label="' + x[1] + '">' + ic(x[2]) + '<span>' + x[1] + '</span></button>'; }).join('');
})();
(function boot() {
  var r = (location.hash || '').replace('#v-', ''); if (VIEWS[r]) ui.route = r;
  var d = new Date(); lastMinute = d.getHours() + ':' + d.getMinutes();
  render();
  resumeTimer();
  if (!S.meta.onboarded) onboardingSheet();
})();
})();
</script>

</body></html>
